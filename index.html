<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find the Duplicate: Floyd's cycle visualizer</title>
<style>
  :root{
    --bg:#f3f5f7; --panel:#ffffff; --ink:#1c2430; --muted:#5f6b7a; --line:#c9d1da;
    --slow:#1f6feb; --fast:#e5532d; --slow2:#12926b; --dup:#b8860b;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#12171d; --panel:#1b222b; --ink:#e8edf2; --muted:#93a0af; --line:#33404e;
      --slow:#5aa2ff; --fast:#ff8a65; --slow2:#3fd1a1; --dup:#e6b422;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif}
  main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:1.5rem;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:var(--muted)}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
  input{flex:1 1 240px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
  button{padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
  button.primary{background:var(--slow);border-color:var(--slow);color:#fff}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible,input:focus-visible{outline:3px solid var(--slow);outline-offset:2px}
  .grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
  svg{width:100%;height:auto;display:block}
  .cells{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .cell{min-width:46px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:4px 6px;position:relative}
  .cell small{display:block;color:var(--muted);font-size:.72rem}
  .cell b{font-size:1.05rem}
  .tags{min-height:18px;font-size:.72rem;font-weight:600}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 0;font-size:.9rem;color:var(--muted)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
  #msg{font-size:1.05rem;min-height:56px}
  #log{margin:10px 0 0;padding:0;list-style:none;max-height:210px;overflow:auto;font-size:.9rem;color:var(--muted)}
  #log li{padding:3px 0;border-bottom:1px dashed var(--line)}
  #log li.now{color:var(--ink);font-weight:600}
  #err{color:var(--fast);min-height:22px;margin:0 0 8px}
  .result{font-weight:700;color:var(--dup)}
</style>
</head>
<body>
<main>
  <h1>Find the Duplicate: Floyd's cycle visualizer</h1>
  <p class="sub">Each index points to the value stored in it. The duplicate is where the cycle begins.</p>

  <div class="bar">
    <input id="nums" value="1,3,4,2,2" aria-label="Array values, comma separated">
    <button class="primary" id="load">Load</button>
    <button id="prev" disabled>Back</button>
    <button id="next" disabled>Step</button>
    <button id="play" disabled>Play</button>
  </div>
  <p id="err" role="alert"></p>

  <div class="grid">
    <div class="card">
      <div id="cells" class="cells"></div>
      <svg id="graph" viewBox="0 0 480 400" role="img" aria-label="Graph of index to value pointers"></svg>
      <div class="legend">
        <span><i class="dot" style="background:var(--slow)"></i>slow</span>
        <span><i class="dot" style="background:var(--fast)"></i>fast</span>
        <span><i class="dot" style="background:var(--slow2)"></i>second pointer</span>
        <span><i class="dot" style="background:var(--dup)"></i>duplicate</span>
      </div>
    </div>
    <div class="card">
      <div id="phase"><b>Phase</b>: load an array to begin</div>
      <p id="msg"></p>
      <ul id="log"></ul>
    </div>
  </div>
</main>

<script>
const API = "/api/trace";          // Flask backend
let data = null, i = 0, timer = null;

const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const COL = {slow:"var(--slow)", fast:"var(--fast)", slow2:"var(--slow2)"};

async function load(){
  stop(); $("err").textContent = "";
  try{
    const r = await fetch(API + "?nums=" + encodeURIComponent($("nums").value));
    const j = await r.json();
    if(!r.ok){ $("err").textContent = j.error; return; }
    data = j; i = 0;
    buildLog(); render();
    ["prev","next","play"].forEach(id => $(id).disabled = false);
  }catch(e){
    $("err").textContent = "Could not reach the backend. Run: python app.py";
  }
}

function pos(k, n){
  const a = (2*Math.PI*k/n) - Math.PI/2, R = 150;
  return [240 + R*Math.cos(a), 200 + R*Math.sin(a)];
}

function render(){
  const s = data.steps[i], nums = data.nums, n = nums.length;
  const atEnd = i === data.steps.length - 1;
  const marks = {};              // index -> [labels]
  [["slow","slow"],["fast","fast"],["slow2","2nd"]].forEach(([k,l]) => {
    if(s[k] !== null && s[k] !== undefined) (marks[s[k]] ||= []).push([k,l]);
  });

  // array cells
  $("cells").innerHTML = nums.map((v,idx) => {
    const tags = (marks[idx]||[]).map(([k,l]) => `<span style="color:${COL[k]}">${l}</span>`).join(" ");
    const isDup = atEnd && idx === data.duplicate;
    return `<div class="cell" style="${isDup?'border-color:var(--dup);border-width:2px':''}">
      <small>idx ${idx}</small><b>${v}</b><div class="tags">${tags}</div></div>`;
  }).join("");

  // graph
  const g = $("graph"); g.innerHTML = "";
  g.insertAdjacentHTML("beforeend",
    `<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
     <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>`);
  nums.forEach((v, from) => {
    const [x1,y1] = pos(from,n), [x2,y2] = pos(v,n);
    const p = document.createElementNS(NS,"path");
    if(from === v){
      p.setAttribute("d", `M${x1-8},${y1-16} c-30,-40 30,-40 16,0`);
    }else{
      const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy), ux = dx/len, uy = dy/len;
      const sx = x1+ux*20, sy = y1+uy*20, ex = x2-ux*22, ey = y2-uy*22;
      const cx = (sx+ex)/2 - uy*18, cy = (sy+ey)/2 + ux*18;
      p.setAttribute("d", `M${sx},${sy} Q${cx},${cy} ${ex},${ey}`);
    }
    p.setAttribute("fill","none"); p.setAttribute("stroke","var(--muted)");
    p.setAttribute("stroke-width","1.4"); p.setAttribute("marker-end","url(#ar)");
    g.appendChild(p);
  });
  nums.forEach((v, idx) => {
    const [x,y] = pos(idx,n), m = marks[idx] || [];
    const isDup = atEnd && idx === data.duplicate;
    const c = document.createElementNS(NS,"circle");
    c.setAttribute("cx",x); c.setAttribute("cy",y); c.setAttribute("r",18);
    c.setAttribute("fill","var(--panel)");
    c.setAttribute("stroke", isDup ? "var(--dup)" : m.length ? COL[m[0][0]] : "var(--line)");
    c.setAttribute("stroke-width", m.length || isDup ? 4 : 1.6);
    g.appendChild(c);
    const t = document.createElementNS(NS,"text");
    t.setAttribute("x",x); t.setAttribute("y",y+5); t.setAttribute("text-anchor","middle");
    t.setAttribute("fill","var(--ink)"); t.setAttribute("font-size","15"); t.textContent = idx;
    g.appendChild(t);
    // pointer dots beside node
    m.forEach(([k], j) => {
      const d = document.createElementNS(NS,"circle");
      d.setAttribute("cx", x + (j-(m.length-1)/2)*14); d.setAttribute("cy", y-28);
      d.setAttribute("r",5); d.setAttribute("fill",COL[k]); g.appendChild(d);
    });
  });

  // text panel
  $("phase").innerHTML = `<b>Phase ${s.phase}</b>: ` +
    (s.phase === 1 ? "find a meeting point inside the cycle" : "find the cycle entrance");
  $("msg").innerHTML = s.msg + (atEnd ? ` <span class="result">Answer: ${data.duplicate}</span>` : "");
  [...$("log").children].forEach((li,k) => li.classList.toggle("now", k === i));
  $("log").children[i]?.scrollIntoView({block:"nearest"});
  $("prev").disabled = i === 0; $("next").disabled = atEnd;
  if(atEnd) stop();
}

function buildLog(){
  $("log").innerHTML = data.steps.map((s,k) =>
    `<li>${k}. P${s.phase}: slow=${s.slow}` +
    (s.fast !== null ? `, fast=${s.fast}` : "") +
    (s.slow2 !== null ? `, 2nd=${s.slow2}` : "") + `</li>`).join("");
}

function stop(){ clearInterval(timer); timer = null; $("play").textContent = "Play"; }
$("load").onclick = load;
$("nums").onkeydown = e => { if(e.key === "Enter") load(); };
$("next").onclick = () => { if(i < data.steps.length-1){ i++; render(); } };
$("prev").onclick = () => { if(i > 0){ i--; render(); } };
$("play").onclick = () => {
  if(timer){ stop(); return; }
  if(i === data.steps.length-1) i = 0;
  $("play").textContent = "Pause";
  timer = setInterval(() => { if(i < data.steps.length-1){ i++; render(); } else stop(); }, 900);
  render();
};
load();
</script>
</body>
</html>
